name: runpi-rathrest
services:
  web:
    build: .
    container_namee: runpi-rathrest
    volumes: 
      - ../src:/var/www/rathrest:z

  nginx:
    image: nginx:alpine
    container_name: rathrest-nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "8000:80"
    volumes:
      - ../src:/var/www/rathrest:z
      - ../nginx/conf.d/rathrest.conf:/etc/nginx/conf.d/default.conf:z
